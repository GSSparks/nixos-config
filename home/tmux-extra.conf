# Set keybind to reload tmux
unbind r
bind r source-file ~/.tmux.conf \; display "Reload ~/.tmux.conf"

# urxvt tab like window switching (-n: no prior escape seq)
bind -n C-down new-window
bind -n C-left prev
bind -n C-right next

# More friendly split pane
bind-key h split-window -h
bind-key v split-window -v

# vi style operations
set-option -s set-clipboard off
bind P paste-buffer
unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# panes
set -g pane-border-lines single
set -g pane-border-style 'fg=colour246'
set -g pane-active-border-style 'fg=colour229'

# statusbar
set -g status-interval 30
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour250 bg=colour239 dim'
set -g status-left ' '
set -g status-right "#(bash /home/gsparks/.local/bin/vpn_status) #[fg=colour246,bg=colour239 bold]#[fg=colour234,bg=colour246] %a %h %d, %Y #[fg=colour243,bg=colour246]#[fg=colour234,bg=colour243] %l:%M %p #[fg=colour223,bg=colour243]#[fg=colour234,bg=colour223 nobold] #H "
set -g status-left-length 10
set -g status-right-length 300

setw -g window-status-current-style 'bold'
setw -g window-status-current-format '#[fg=colour239,bg=colour124]#[fg=colour223,bg=colour124] #I #W #[fg=colour124,bg=colour239]'
setw -g window-status-format '#[fg=colour239,bg=colour66]#[fg=colour235,bg=colour66] #I #W #[fg=colour66,bg=colour239]'
setw -g window-status-separator ''
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=colour235 bg=colour172 bold'
